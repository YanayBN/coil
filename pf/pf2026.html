<style>

    --ink:#1c1b18;
    --paper:#eee8da;

  }

  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);

  header{
    position:sticky;
    top:0;
    z-index:50;
    background:var(--paper-soft);
    border-bottom:2px solid var(--ink);
    padding:18px clamp(16px,4vw,48px);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
  }
  .brand{
    position:relative;
    display:inline-block;
  }
  .brand h1{
    margin:0;
    font-family:'Frank Ruhl Libre', serif;
    font-weight:900;
    font-size:clamp(1.05rem, 2.4vw, 1.65rem);
    letter-spacing:.2px;
    line-height:1.15;
  }
  .brand svg{
    position:absolute;
    left:0;
    right:0;
    bottom:-9px;
    width:100%;
    height:14px;
    overflow:visible;
  }
  .brand path{
    fill:none;
    stroke:var(--pen);
    stroke-width:3;
    stroke-linecap:round;
    stroke-dasharray:400;
    stroke-dashoffset:400;
    animation:draw 1.1s .3s ease-out forwards;
  }
  @keyframes draw{ to{ stroke-dashoffset:0; } }

  .header-actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  .stamp-btn{
    font-family:'Rubik', sans-serif;
    font-weight:600;
    font-size:.82rem;
    letter-spacing:.02em;
    text-decoration:none;
    color:var(--ink);
    background:transparent;
    border:2px solid var(--ink);
    border-radius:var(--radius);
    padding:9px 16px;
    display:inline-flex;
    align-items:center;
    gap:8px;
    transform:rotate(-1deg);
    transition:transform .18s ease, background .18s ease, color .18s ease, border-color .18s ease;
    white-space:nowrap;
  }
  .stamp-btn:nth-of-type(2){transform:rotate(1deg);}
  .stamp-btn:hover{
    background:var(--pen);
    border-color:var(--pen);
    color:var(--paper-soft);
    transform:rotate(0deg) scale(1.03);
  }
  .stamp-btn svg{width:15px;height:15px;flex-shrink:0;}

  /* ---------- EYEBROWS / SECTION HEADS ---------- */

    padding:56px clamp(16px,4vw,48px) 22px;
    max-width:1400px;
    margin:0 auto;
  }
  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-family:'Rubik', sans-serif;
    font-weight:600;
    font-size:.78rem;
    letter-spacing:.06em;
    color:var(--pen);

  }
  .filmstrip-ticks span{

  }
  .slider-track{

    overflow-x:auto;
    scroll-snap-type:x mandatory;
    gap:6px;
    scrollbar-width:none;
  }
  .slider-track::-webkit-scrollbar{display:none;}
  .slide{
    position:relative;
    flex:0 0 100%;
    scroll-snap-align:center;
    aspect-ratio:16/8;
    overflow:hidden;
    background:#000;
  }
  .slide img{

    object-fit:cover;
    display:block;
  }
  .slide-corner{
    position:absolute;
    top:10px;
    left:10px;

    color:var(--paper-soft);

    font-weight:600;
    font-size:.72rem;

  .slider-controls{

    align-items:center;
    justify-content:space-between;
    padding-top:12px;
  }
  .slider-dots{

    gap:6px;
    flex-wrap:wrap;
  }

    width:7px;height:7px;
    border-radius:50%;
    border:none;
    background:var(--line);
    cursor:pointer;
    padding:0;

  .slider-arrows{display:flex; gap:8px;}
  .slider-arrows button{

    border:2px solid var(--ink);
    background:var(--paper-soft);
    border-radius:50%;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background .15s ease, color .15s ease;
  }
  .slider-arrows button:hover{background:var(--ink); color:var(--paper-soft);}
  .slider-arrows svg{width:16px;height:16px;}

  @media (min-width:760px){
    .slide{aspect-ratio:16/6.2;}
  }

  .video-grid{
    max-width:1400px;

    width:100%;

    html{scroll-behavior:auto;}
    .brand path{animation:none; stroke-dashoffset:0;}
    *{transition:none !important;}

/* ============ HELPERS ============ */
function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const IMAGE_EXT = /\.(jpe?g|png|gif|webp|svg)(\?.*)?$/i;

function normalizeVideo(url){
  if(IMAGE_EXT.test(url)) return null; // stray image link, not a video

  let m;
  // youtube - already an embed url
  if(m = url.match(/youtube\.com\/embed\/([\w-]+)/)){
    return { platform:"youtube", key:"yt:"+m[1], src:`https://www.youtube.com/embed/${m[1]}` };
  }
  // youtu.be short link
  if(m = url.match(/youtu\.be\/([\w-]+)/)){
    return { platform:"youtube", key:"yt:"+m[1], src:`https://www.youtube.com/embed/${m[1]}` };
  }
  // youtube watch
  if(m = url.match(/[?&]v=([\w-]+)/)){
    return { platform:"youtube", key:"yt:"+m[1], src:`https://www.youtube.com/embed/${m[1]}` };
  }
  // youtube shorts
  if(m = url.match(/youtube\.com\/shorts\/([\w-]+)/)){
    return { platform:"youtube", key:"yt:"+m[1], src:`https://www.youtube.com/embed/${m[1]}` };
  }
  // tiktok embed
  if(m = url.match(/tiktok\.com\/embed\/v2\/([\w-]+)/)){
    return { platform:"tiktok", key:"tt:"+m[1], src:url };
  }
  // instagram
  if(m = url.match(/instagram\.com\/(p|reel)\/([\w-]+)/)){
    return { platform:"instagram", key:"ig:"+m[2], src:`https://www.instagram.com/${m[1]}/${m[2]}/embed` };
  }
  // facebook video
  if(m = url.match(/facebook\.com\/.+\/videos\/(\d+)/)){
    return { platform:"facebook", key:"fb:"+m[1], src:`https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(url)}&show_text=0` };
  }
  return null;
}

function buildVideoList(rawLinks){
  const seen = new Set();
  const list = [];
  rawLinks.forEach(url => {
    const v = normalizeVideo(url.trim());
    if(!v || seen.has(v.key)) return;
    seen.add(v.key);
    list.push(v);
  });
  return list;
}

const ASPECT = { tiktok:"9/16", instagram:"9/16", youtube:"16/9", facebook:"16/9" };
const LABEL  = { tiktok:"טיקטוק", instagram:"אינסטגרם", youtube:"יוטיוב", facebook:"פייסבוק" };

/* ============ SLIDER ============ */
(function initSlider(){
  const track = document.getElementById('sliderTrack');
  const dotsWrap = document.getElementById('sliderDots');
  const ticks = document.getElementById('ticks');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');

  const files = shuffle(IMAGE_FILES);

  files.forEach((file, i) => {
    const slide = document.createElement('div');
    slide.className = 'slide';
    const img = document.createElement('img');
    img.src = IMG_BASE + encodeURIComponent(file);
    img.alt = file.replace(/\.[a-z]+$/i,'').replace(/\(\d\)$/,'').trim();
    img.loading = i === 0 ? 'eager' : 'lazy';
    slide.appendChild(img);
    const corner = document.createElement('span');
    corner.className = 'slide-corner';
    corner.textContent = String(i+1).padStart(2,'0');
    slide.appendChild(corner);
    track.appendChild(slide);

    const dot = document.createElement('button');
    if(i === 0) dot.classList.add('active');
    dot.addEventListener('click', () => goTo(i));
    dotsWrap.appendChild(dot);
  });

  for(let i=0;i<24;i++){
    const t = document.createElement('span');
    ticks.appendChild(t);
  }

  const dots = [...dotsWrap.children];
  let current = 0;
  let autoplayTimer;

  function goTo(i){
    current = (i + files.length) % files.length;
    track.scrollTo({ left: track.clientWidth * current, behavior:'smooth' });
    dots.forEach((d,idx) => d.classList.toggle('active', idx === current));
  }

  prevBtn.addEventListener('click', () => { goTo(current-1); resetAutoplay(); });
  nextBtn.addEventListener('click', () => { goTo(current+1); resetAutoplay(); });

  let scrollTimeout;
  track.addEventListener('scroll', () => {
    clearTimeout(scrollTimeout);
    scrollTimeout = setTimeout(() => {
      const idx = Math.round(track.scrollLeft / track.clientWidth);
      current = idx;
      dots.forEach((d,i) => d.classList.toggle('active', i === idx));
    }, 100);
  });

  function resetAutoplay(){
    clearInterval(autoplayTimer);
    autoplayTimer = setInterval(() => goTo(current+1), 4500);
  }
  track.addEventListener('mouseenter', () => clearInterval(autoplayTimer));
  track.addEventListener('mouseleave', resetAutoplay);
  window.addEventListener('resize', () => goTo(current));

  if(files.length > 1) resetAutoplay();
})();

    const iframe = document.createElement('iframe');
    iframe.src = v.src;
    iframe.loading = 'lazy';
    iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen';
    iframe.allowFullscreen = true;
    frame.appendChild(iframe);

    const tag = document.createElement('div');
    tag.className = 'video-tag';
    tag.innerHTML = `<span>${LABEL[v.platform] || v.platform}</span><span class="dot">●</span>`;

    card.appendChild(frame);
    card.appendChild(tag);
    grid.appendChild(card);
  }

  function loadMore(){
    if(cursor >= videos.length) return;
    loadingRow.hidden = false;
    const next = videos.slice(cursor, cursor + BATCH);
    next.forEach(renderCard);
    cursor += BATCH;
    loadingRow.hidden = cursor >= videos.length;
  }

  loadMore();

  const io = new IntersectionObserver((entries) => {
    entries.forEach(entry => { if(entry.isIntersecting) loadMore(); });
  }, { rootMargin: '400px 0px' });
  io.observe(sentinel);
})();
</script>
</body>
</html>
