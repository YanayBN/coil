<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Yanay Ben Noach — Creative Copywriter portfolio">
  <title>Yanay Ben Noach | Creative Copywriter | Portfolio</title>
  <style>
    :root {
      --bg: #0a0a0b;
      --panel: #121214;
      --text: #f5f5f5;
      --muted: #a7a7ad;
      --line: rgba(255,255,255,.10);
      --accent: #ffffff;
      --radius: 22px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background:
        radial-gradient(circle at 90% 0%, rgba(255,255,255,.08), transparent 30%),
        radial-gradient(circle at 0% 30%, rgba(255,255,255,.045), transparent 25%),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 18px;
      min-height: 78px;
      padding: 14px 4vw;
      background: rgba(10,10,11,.78);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    h1 {
      order: 2;
      margin: 0 0 0 auto;
      text-align: right;
      font-size: clamp(16px, 2vw, 24px);
      line-height: 1.15;
      font-weight: 650;
      letter-spacing: -.025em;
      white-space: nowrap;
    }

    .actions {
      order: 1;
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
    }

    .contact {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 16px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--text);
      background: rgba(255,255,255,.06);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      transition: .2s ease;
    }

    .contact:hover {
      background: #fff;
      color: #000;
      transform: translateY(-1px);
    }

    main {
      width: min(1500px, 94vw);
      margin: 0 auto;
      padding: 34px 0 60px;
    }

    .slider-section { margin: 0 0 46px; }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 14px;
    }

    .section-head h2 {
      margin: 0;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: .18em;
      color: var(--muted);
      font-weight: 650;
    }

    .controls {
      display: flex;
      gap: 7px;
    }

    .arrow {
      width: 38px;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: rgba(255,255,255,.05);
      color: var(--text);
      cursor: pointer;
      font-size: 18px;
      transition: .2s ease;
    }

    .arrow:hover {
      background: #fff;
      color: #000;
    }

    .track {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      padding: 2px 2px 12px;
      cursor: grab;
      -webkit-overflow-scrolling: touch;
    }

    .track:active { cursor: grabbing; }
    .track::-webkit-scrollbar { display: none; }

    .card {
      flex: 0 0 min(78vw, 720px);
      scroll-snap-align: start;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: 0 14px 45px rgba(0,0,0,.20);
    }

    .wide-card { aspect-ratio: 16 / 9; }
    .image-card { flex-basis: min(78vw, 760px); }
    .vertical-track .card {
      flex-basis: min(48vw, 330px);
      aspect-ratio: 9 / 16;
    }

    .card iframe,
    .card img {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      object-fit: cover;
      background: #09090a;
    }

    .card img { cursor: zoom-in; }

    .image-card {
      aspect-ratio: 16 / 10;
    }

    .image-card img { object-fit: contain; }

    .empty {
      padding: 40px;
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      color: var(--muted);
    }

    footer {
      width: min(1500px, 94vw);
      margin: 0 auto;
      padding: 10px 0 35px;
      color: #66666d;
      font-size: 12px;
      text-align: right;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(0,0,0,.88);
      backdrop-filter: blur(10px);
    }

    .lightbox.open { display: flex; }
    .lightbox img {
      max-width: min(95vw, 1500px);
      max-height: 92vh;
      object-fit: contain;
      border-radius: 12px;
    }

    .close {
      position: fixed;
      top: 20px;
      right: 24px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.08);
      color: #fff;
      font-size: 24px;
      cursor: pointer;
    }

    @media (max-width: 720px) {
      header {
        align-items: flex-start;
        flex-direction: column;
        padding: 13px 4vw 15px;
      }

      h1 {
        order: 1;
        width: 100%;
        margin: 0;
        white-space: normal;
      }

      .actions { order: 2; width: 100%; }
      .contact { flex: 1; }
      main { padding-top: 25px; }
      .card { flex-basis: 88vw; }
      .vertical-track .card { flex-basis: 68vw; }
    }
  </style>
</head>
<body>
  <header>
    <div class="actions">
      <a class="contact" href="https://wa.me/972525363323" target="_blank" rel="noopener noreferrer">Contact on Whatsapp</a>
      <a class="contact" href="mailto:YanayBN@gmail.com">Contact by eMail</a>
    </div>
    <h1>Yanay Ben Noach | Creative Copywriter | Portfolio</h1>
  </header>

  <main>
    <section class="slider-section">
      <div class="section-head">
        <h2>Selected Video</h2>
        <div class="controls">
          <button class="arrow" data-target="wide-track" data-dir="-1" aria-label="Previous">‹</button>
          <button class="arrow" data-target="wide-track" data-dir="1" aria-label="Next">›</button>
        </div>
      </div>
      <div id="wide-track" class="track"></div>
    </section>

    <section class="slider-section">
      <div class="section-head">
        <h2>Creative Work</h2>
        <div class="controls">
          <button class="arrow" data-target="image-track" data-dir="-1" aria-label="Previous">‹</button>
          <button class="arrow" data-target="image-track" data-dir="1" aria-label="Next">›</button>
        </div>
      </div>
      <div id="image-track" class="track"></div>
    </section>

    <section class="slider-section">
      <div class="section-head">
        <h2>Short Form</h2>
        <div class="controls">
          <button class="arrow" data-target="vertical-track" data-dir="-1" aria-label="Previous">‹</button>
          <button class="arrow" data-target="vertical-track" data-dir="1" aria-label="Next">›</button>
        </div>
      </div>
      <div id="vertical-track" class="track vertical-track"></div>
    </section>
  </main>

  <footer>© Yanay Ben Noach</footer>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="close" aria-label="Close">×</button>
    <img id="lightbox-image" alt="">
  </div>

  <script>
    const wideVideos = ["https://www.youtube.com/embed/riPOfGQjQ_8", "https://www.youtube.com/embed/ITiCGjRcI6Q", "https://www.youtube.com/embed/cPz5YzwRQ4w", "https://www.youtube.com/embed/vt7SeKKFCvg", "https://www.youtube.com/embed/L-0ujR9Kaz8", "https://www.facebook.com/hummus.eliyahu/videos/465965106317950", "https://www.youtube.com/embed/GaoMf0ukcPM", "https://www.youtube.com/embed/iO09S4wXTnE", "https://www.youtube.com/embed/y9v4Fm29N8c", "https://www.youtube.com/embed/FH15CjoKYHM", "https://www.youtube.com/embed/0slFjqd2AAQ", "https://www.youtube.com/embed/NJ4RVuLcgxQ", "https://www.youtube.com/embed/9POuKB-EHxU", "https://www.youtube.com/embed/sye7X44hciw", "https://youtu.be/ITiCGjRcI6Q", "https://youtu.be/QObzGM8ZSfI", "https://youtu.be/ajzVNpfgabk", "https://youtu.be/GX5savDQTcE", "https://www.youtube.com/watch?v=irSdUQMfpTw", "https://youtu.be/9JiMJr8eHzM", "https://youtu.be/ld0IuaWyOrM", "https://youtu.be/qWA7R-thelE", "https://youtu.be/Q4W3CljtgI4", "https://youtu.be/-UbZDtfGB5s", "https://youtu.be/n62HfDX7KYk", "https://youtu.be/2irq5RPOxu4", "https://youtu.be/KRpQsBQpHTY", "https://www.youtube.com/watch?v=fvimgCYebwE", "https://www.youtube.com/watch?v=TrYCO02DzrI"];
    const verticalVideos = ["https://www.tiktok.com/embed/v2/7486512071664798984", "https://www.tiktok.com/embed/v2/7486028223554342151", "https://www.tiktok.com/embed/v2/7447171233914883335", "https://www.instagram.com/p/DHF441sNEMT/embed", "https://www.tiktok.com/embed/v2/7452334809155652871", "https://www.tiktok.com/embed/v2/7477230981187915026", "https://www.tiktok.com/embed/v2/7479811062997552392", "https://www.tiktok.com/embed/v2/7480568932638706952", "https://www.tiktok.com/embed/v2/7450144220376993032", "https://www.tiktok.com/embed/v2/7460499012576218375", "https://www.tiktok.com/embed/v2/7486028220618329351", "https://www.tiktok.com/embed/v2/7452732734394354951", "https://www.instagram.com/p/DDzKSk5ov18/embed", "https://www.tiktok.com/embed/v2/7165446924097654017", "https://www.tiktok.com/embed/v2/7480239120799780104", "https://www.tiktok.com/embed/v2/7447147367725354248", "https://www.tiktok.com/embed/v2/7486381655003794706", "https://www.instagram.com/p/DHaxZP_IO5_/embed", "https://www.tiktok.com/embed/v2/7441949300738870561", "https://www.tiktok.com/embed/v2/7486028223743003911", "https://www.tiktok.com/embed/v2/7441944007464324360", "https://www.tiktok.com/embed/v2/7439632938813213959", "https://www.instagram.com/p/DEPkpocIoME/embed", "https://youtube.com/shorts/Ee0jRDVpRD4", "https://youtube.com/shorts/q2ZC-y9RvvQ", "https://youtube.com/shorts/oHtkemaOoCo", "https://youtube.com/shorts/zDXuZXcXoU4?feature=share", "https://youtube.com/shorts/BCj5suZnkdM", "https://youtube.com/shorts/CeKb2sdi-58", "https://www.instagram.com/reel/DTSE_NZCKAc/?igsh=aHA4eTZ0dDE2Nmts"];
    const images = ["bt tyro (1).jpg", "bt tyro (2).jpg", "budget italy (1).jpg", "budget italy (2).jpg", "chickenmaster.png", "davo chic.png", "gladiator2.jpeg", "harley davidson.png", "kali group (1).jpg", "kali group (2).jpg", "koluman.jpg", "kupperbusch (1).jpg", "kupperbusch (1).png", "manpower (1).jpg", "manpower (2).jpg", "manpower care (1).jpg", "manpower care (2).jpg", "manpower experis (1).jpg", "manpower experis (2).jpg", "manpower tbo.jpg", "metropoline (1).jpg", "metropoline (2).jpg", "metropoline (3).jpg", "proace max (1).jpg", "proace max (2).jpg", "ram aderet (1).jpg", "ram aderet (2).jpg", "supercharlie.jpg", "tineco (1).jpg", "tineco (2).jpg", "toyota (1).jpg", "toyota (2).jpg", "triumph (1).png", "triumph (2).png", "triumph.jpg", "yadid lachinuch.jpg", "yoman masa (1).jpg", "yoman masa (3).jpg", "yoman masa (4).jpg", "yoman masa (5).jpg", "zhuti.jpg"];

    function shuffle(items) {
      const a = [...items];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function makeVideoCard(url, vertical = false) {
      const card = document.createElement("article");
      card.className = "card " + (vertical ? "" : "wide-card");

      const iframe = document.createElement("iframe");
      iframe.src = url;
      iframe.loading = "lazy";
      iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
      iframe.allowFullscreen = true;
      iframe.referrerPolicy = "strict-origin-when-cross-origin";
      iframe.title = "Portfolio video";
      card.appendChild(iframe);
      return card;
    }

    function makeImageCard(filename) {
      const card = document.createElement("article");
      card.className = "card image-card";

      const img = document.createElement("img");
      img.src = "https://yanaybn.github.io/pf/pf_pics/" + encodeURIComponent(filename);
      img.alt = filename.replace(/\.[^.]+$/, "");
      img.loading = "lazy";
      img.addEventListener("click", () => openLightbox(img.src, img.alt));
      card.appendChild(img);
      return card;
    }

    function renderTrack(id, items, renderer) {
      const track = document.getElementById(id);
      shuffle(items).forEach(item => track.appendChild(renderer(item)));
    }

    renderTrack("wide-track", wideVideos, url => makeVideoCard(url, false));
    renderTrack("image-track", images, makeImageCard);
    renderTrack("vertical-track", verticalVideos, url => makeVideoCard(url, true));

    document.querySelectorAll(".arrow").forEach(button => {
      button.addEventListener("click", () => {
        const track = document.getElementById(button.dataset.target);
        const amount = Math.max(track.clientWidth * 0.82, 320);
        track.scrollBy({ left: Number(button.dataset.dir) * amount, behavior: "smooth" });
      });
    });

    // Mouse/touch-friendly drag scrolling.
    document.querySelectorAll(".track").forEach(track => {
      let down = false, startX = 0, startScroll = 0;

      track.addEventListener("pointerdown", e => {
        down = true;
        startX = e.clientX;
        startScroll = track.scrollLeft;
        track.setPointerCapture(e.pointerId);
      });

      track.addEventListener("pointermove", e => {
        if (!down) return;
        track.scrollLeft = startScroll - (e.clientX - startX);
      });

      const stop = () => { down = false; };
      track.addEventListener("pointerup", stop);
      track.addEventListener("pointercancel", stop);
      track.addEventListener("pointerleave", stop);
    });

    const lightbox = document.getElementById("lightbox");
    const lightboxImage = document.getElementById("lightbox-image");

    function openLightbox(src, alt) {
      lightboxImage.src = src;
      lightboxImage.alt = alt;
      lightbox.classList.add("open");
      lightbox.setAttribute("aria-hidden", "false");
    }

    function closeLightbox() {
      lightbox.classList.remove("open");
      lightbox.setAttribute("aria-hidden", "true");
      lightboxImage.src = "";
    }

    document.querySelector(".close").addEventListener("click", closeLightbox);
    lightbox.addEventListener("click", e => {
      if (e.target === lightbox) closeLightbox();
    });
    document.addEventListener("keydown", e => {
      if (e.key === "Escape") closeLightbox();
    });
  </script>
</body>
</html>
