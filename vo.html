<style>
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --border: #222233;

    --accent2: #e8c98e;
    --text: #e8e8f0;
    --muted: #888899;
    --wa: #25D366;
    --radius: 12px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Heebo', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* HEADER */
  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    background: rgba(10,10,15,0.95);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .site-title {
    font-size: clamp(1.4rem, 4.5vw, 3rem);
    font-weight: 900;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.3;
  }

  .header-buttons {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border-radius: 50px;
    font-family: 'Heebo', sans-serif;
    font-size: 0.82rem;
    font-weight: 700;
    text-decoration: none;
    transition: transform 0.15s, box-shadow 0.15s;
    white-space: nowrap;
    border: none;
    cursor: pointer;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,0.4); }
  .btn svg { width: 15px; height: 15px; flex-shrink: 0; }

  .btn-wa    { background: var(--wa); color: #fff; }
  .btn-email { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }
  .btn-email:hover { background: rgba(200,169,110,0.1); }

  /* MAIN */
  main {
    padding-top: 100px;
    padding-bottom: 60px;
  }

  /* GRID */
  .portfolio-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(480px, 1fr));
    gap: 20px;
    max-width: 1400px;
    margin: 24px auto 0;
    padding: 0 20px;
  }

  /* CARD */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: transform 0.2s, box-shadow 0.2s;
    animation: fadeUp 0.4s ease both;
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(200,169,110,0.2);
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* EMBED WRAPPERS — all horizontal 16:9 */
  .embed-wrapper {
    position: relative;
    width: 100%;
    background: #000;
    overflow: hidden;
    padding-bottom: 56.25%;
  }
  .embed-wrapper iframe {
    position: absolute;
    border: none;
    display: block;
  }
  /* Vertical clips: scale down and center inside the 16:9 box */
  .iframe-normal {
    top: 0; left: 0;
    width: 100%; height: 100%;
  }
  /* Vertical clips: scale UP to fill the 16:9 box (crops sides, centered) */
  .iframe-vertical {
    /* A 9:16 clip filling a 16:9 box: height must be 100%, width = 100% * (16/9)/(9/16) = 316.4% */
    width: 316.4%;
    height: 100%;
    left: 50%;
    top: 0;
    transform: translateX(-50%);
  }
  .iframe-reel {
    /* A 4:5 reel filling a 16:9 box: width = 100% * (16/9)/(4/5) = 222.2% */
    width: 222.2%;
    height: 100%;
    left: 50%;
    top: 0;
    transform: translateX(-50%);
  }

  /* CARD DESCRIPTION */
  .card-desc {
    padding: 12px 14px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .platform-badge {
    width: 26px; height: 26px;
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .badge-youtube  { background: #FF0000; }
  .badge-facebook { background: #1877F2; }
  .badge-tiktok   { background: #010101; border: 1px solid #444; }
  .badge-instagram{ background: radial-gradient(circle at 30% 110%, #fdf497, #fd5949, #d6249f, #285AEB); }
  .card-desc p {
    font-size: 0.83rem;
    color: var(--muted);
    line-height: 1.4;
  }

  /* LOADING */
  #load-sentinel { height: 1px; margin-top: 40px; }
  #loading-msg {
    text-align: center;
    padding: 24px;
    color: var(--muted);
    font-size: 0.85rem;
    display: none;
  }
  #loading-msg.show { display: block; }

  @media (max-width: 500px) {
    header { padding: 9px 12px; }
    .site-title { font-size: 1rem; }
    .btn { padding: 7px 12px; font-size: 0.75rem; }
    .portfolio-grid { grid-template-columns: 1fr; padding: 0 10px; }
  }
</style>

function buildCard(item, delay) {
  var p = getPlatform(item.url);
  var src = '';
  var iframeClass = 'iframe-normal';

  if (p === 'youtube') {
    var id = getYTId(item.url);
    if (!id) return null;
    src = 'https://www.youtube.com/embed/' + id;
