<style>
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --border: #1e1e2e;
    --accent: #c8a96e;
    --accent2: #e8c98e;
    --text: #e8e8f0;
    --muted: #888899;
    --wa: #25D366;
    --radius: 12px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Heebo', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    background-image: radial-gradient(ellipse at 20% 50%, #1a1025 0%, transparent 60%),
                      radial-gradient(ellipse at 80% 20%, #0d1a2a 0%, transparent 50%);
  }

  /* ── HEADER ── */
  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    background: rgba(10,10,15,0.92);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  .site-title {
    font-size: clamp(1rem, 3vw, 1.4rem);
    font-weight: 900;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.02em;
    line-height: 1.2;
  }

  .header-buttons {
    display: flex;
    gap: 10px;
    flex-shrink: 0;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 9px 18px;
    border-radius: 50px;
    font-family: 'Heebo', sans-serif;
    font-size: 0.85rem;
    font-weight: 700;
    text-decoration: none;
    transition: transform 0.15s, box-shadow 0.15s;
    cursor: pointer;
    border: none;
    white-space: nowrap;
  }

  .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.4); }
  .btn:active { transform: translateY(0); }

  .btn-wa {
    background: var(--wa);
    color: #fff;
  }

  .btn-email {
    background: transparent;
    color: var(--accent);
    border: 1.5px solid var(--accent);
  }

  .btn-email:hover { background: rgba(200,169,110,0.1); }

  .btn svg { width: 16px; height: 16px; flex-shrink: 0; }

  /* ── MAIN ── */
  main {
    padding-top: 90px;
    padding-bottom: 60px;
  }

  .hero {
    text-align: center;
    padding: 60px 24px 40px;
    position: relative;
  }

  .hero::after {
    content: '';
    display: block;
    width: 80px;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), transparent);
    margin: 24px auto 0;
    border-radius: 2px;
  }

  .hero-label {
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }

  .hero-heading {
    font-size: clamp(2rem, 6vw, 3.5rem);
    font-weight: 900;
    line-height: 1.1;
    background: linear-gradient(135deg, #fff 30%, var(--accent) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* ── GRID ── */
  .grid-section { padding: 0 20px 20px; }

  .portfolio-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 24px;
    max-width: 1400px;
    margin: 0 auto;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: transform 0.2s, box-shadow 0.2s;
    animation: fadeUp 0.4s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(200,169,110,0.15);
  }

  .embed-wrapper {
    position: relative;
    width: 100%;
    background: #000;
  }

  /* YouTube / Facebook video: 16:9 */
  .embed-wrapper.ratio-16-9 { padding-bottom: 56.25%; }

  /* TikTok / Instagram: taller */
  .embed-wrapper.ratio-tiktok { padding-bottom: 177%; }
  .embed-wrapper.ratio-instagram { padding-bottom: 125%; }

  .embed-wrapper iframe,
  .embed-wrapper blockquote {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    border: none;
  }

  .card-desc {
    padding: 14px 16px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .platform-badge {
    width: 28px; height: 28px;
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    font-size: 14px;
  }

  .badge-youtube  { background: #FF0000; }
  .badge-facebook { background: #1877F2; }
  .badge-tiktok   { background: #010101; border: 1px solid #333; }
  .badge-instagram{ background: radial-gradient(circle at 30% 110%, #fdf497,#fd5949,#d6249f,#285AEB); }

  .card-desc p {
    font-size: 0.85rem;
    color: var(--muted);
    line-height: 1.4;
  }

  /* Load more */
  #load-more-trigger { height: 40px; }

  .loading-indicator {
    text-align: center;
    padding: 20px;
    color: var(--muted);
    font-size: 0.85rem;
    display: none;
  }

  .loading-indicator.visible { display: block; }

  @media (max-width: 480px) {
    header { padding: 10px 14px; }
    .site-title { font-size: 0.9rem; }
    .btn { padding: 7px 13px; font-size: 0.78rem; }
    .portfolio-grid { grid-template-columns: 1fr; }
  }
</style>
</head>

  if (/youtube\.com|youtu\.be/.test(url)) return 'youtube';
  if (/facebook\.com|fb\.watch/.test(url)) return 'facebook';
  if (/tiktok\.com/.test(url)) return 'tiktok';
  if (/instagram\.com/.test(url)) return 'instagram';
  return 'unknown';
}

function getYouTubeId(url) {
  const m = url.match(/(?:v=|youtu\.be\/|shorts\/)([a-zA-Z0-9_-]{11})/);
  return m ? m[1] : null;
}

function getFacebookVideoId(url) {
  const m = url.match(/(?:videos\/|v=|watch\/\?v=)(\d+)/);
  return m ? m[1] : null;
}

function getTikTokId(url) {
  const m = url.match(/video\/(\d+)/);
  return m ? m[1] : null;
}

function getInstagramId(url) {
  const m = url.match(/\/(?:p|reel)\/([A-Za-z0-9_-]+)/);

}

function buildEmbedHTML(item) {
  const platform = detectPlatform(item.url);
  let embedContent = '';
  let ratioClass = 'ratio-16-9';
  let loadStrategy = 'eager';

  if (platform === 'youtube') {
    const id = getYouTubeId(item.url);
    embedContent = id
      ? `<iframe src="https://www.youtube.com/embed/${id}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>`
      : `<div style="padding:20px;color:#666;text-align:center">לא ניתן לטעון</div>`;
  } else if (platform === 'facebook') {
    const encodedUrl = encodeURIComponent(item.url);
    embedContent = `<iframe src="https://www.facebook.com/plugins/video.php?href=${encodedUrl}&show_text=false&width=600" allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share" allowfullscreen loading="lazy"></iframe>`;
  } else if (platform === 'tiktok') {
    const id = getTikTokId(item.url);
    ratioClass = 'ratio-tiktok';
    embedContent = id

      : `<div style="padding:20px;color:#666;text-align:center">לא ניתן לטעון</div>`;
  } else if (platform === 'instagram') {
    const id = getInstagramId(item.url);

function loadMore() {
  const items = PORTFOLIO.slice(loaded, loaded + PAGE_SIZE);
  if (items.length === 0) return;

  loading.classList.add('visible');
  setTimeout(() => {
    items.forEach((item, i) => {
      const div = document.createElement('div');
      div.innerHTML = buildEmbedHTML(item);
      const card = div.firstElementChild;
      card.style.animationDelay = (i * 60) + 'ms';
      grid.appendChild(card);
    });
    loaded += items.length;
    loading.classList.remove('visible');
  }, 300);
}
