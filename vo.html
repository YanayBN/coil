<head>

  <style>
    :root {
      --bg: #f7f5f0;
      --surface: #ffffff;
      --border: #e0dbd0;
      --gold: #b8922a;
      --gold-light: #c9a84c;
      --text: #1a1a1a;
      --text-dim: #666;
      --radius: 12px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Heebo', sans-serif;
      min-height: 100vh;
      direction: rtl;
    }

    /* ── HEADER ── */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(247,245,240,0.95);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: 0 clamp(16px, 4vw, 60px);
    }

    .header-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      padding: 16px 0;
    }

    .header-title {
      font-family: 'Frank Ruhl Libre', serif;
      font-size: clamp(1.2rem, 2.5vw, 1.7rem);
      line-height: 1.2;
      color: #1a1a1a;
      white-space: nowrap;
    }
    .header-title strong {
      font-weight: 900;
    }
    .header-title span {
      font-weight: 400;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      flex-shrink: 0;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 18px;
      border-radius: 8px;
      font-family: 'Heebo', sans-serif;
      font-size: 0.88rem;
      font-weight: 700;
      text-decoration: none;
      transition: transform 0.15s, box-shadow 0.15s;
      cursor: pointer;
      border: none;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.4); }
    .btn:active { transform: translateY(0); }

    .btn-whatsapp {
      background: #25D366;
      color: #fff;
    }
    .btn-email {
      background: transparent;
      color: var(--gold);
      border: 1.5px solid var(--gold);
    }
    .btn-email:hover { background: rgba(184,146,42,0.08); }

    .btn svg { width: 17px; height: 17px; fill: currentColor; flex-shrink: 0; }

    /* ── MAIN ── */
    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: clamp(24px, 4vw, 48px) clamp(16px, 4vw, 60px);
    }

    .section-label {
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 24px;
      font-weight: 700;
    }

    .card-description {
      padding: 14px 16px;
      font-size: 0.88rem;
      color: var(--text-dim);
      line-height: 1.55;
      border-top: 1px solid var(--border);
      flex: 1;
    }

    /* ── GRID ── */
    .portfolio-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr));
      gap: 24px;
    }

    /* ── CARD ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 0.45s ease forwards;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .card:hover {
      border-color: var(--gold);
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(0,0,0,0.12);
    }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    .embed-wrapper {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      position: relative;
      overflow: hidden;
    }

    .embed-wrapper iframe,
    .embed-wrapper blockquote {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* TikTok special: their embed doesn't fill naturally */
    .embed-wrapper.tiktok {
      aspect-ratio: 9 / 16;
      max-height: 560px;
    }
    .embed-wrapper.tiktok blockquote {
      position: relative;
      inset: auto;
      width: 100%;
      height: 100%;
      margin: 0 !important;
    }

    /* Facebook */
    .embed-wrapper.facebook {
      aspect-ratio: 1 / 1;
    }

    .card-source-tag {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 6px;
    }
    .tag-youtube  { background: #ff000022; color: #ff4444; }
    .tag-facebook { background: #1877f222; color: #60a5fa; }
    .tag-tiktok   { background: #010101; color: #69c9d0; border: 1px solid #333; }
    .tag-instagram{ background: #e1306c22; color: #f06292; }

    /* ── LOAD MORE ── */
    #load-sentinel { height: 1px; }

    .loading-indicator {
      text-align: center;
      padding: 32px;
      color: var(--text-dim);
      font-size: 0.85rem;
      display: none;
    }
    .loading-indicator.visible { display: block; }

    /* ── RESPONSIVE tweaks ── */
    @media (max-width: 480px) {
      .header-inner { gap: 10px; }
      .btn { padding: 8px 12px; font-size: 0.8rem; }
    }
  </style>
</head>

/* ══ Helpers ══ */
function detectSource(url) {
  if (/youtube\.com|youtu\.be/.test(url))  return 'youtube';
  if (/facebook\.com/.test(url))           return 'facebook';
  if (/tiktok\.com/.test(url))             return 'tiktok';
  if (/instagram\.com/.test(url))          return 'instagram';
  return 'unknown';
}

function youtubeId(url) {
  const m = url.match(/(?:v=|youtu\.be\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}

function instagramEmbedUrl(url) {
  // normalise to /embed/
  return url.replace(/\/?$/, '/embed/');
}

function buildEmbed(url, source) {
  const wrapper = document.createElement('div');
  wrapper.className = 'embed-wrapper';

  if (source === 'youtube') {
    const id = youtubeId(url);
    if (!id) return null;
    const iframe = document.createElement('iframe');
    iframe.src = `https://www.youtube.com/embed/${id}`;
    iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
    iframe.allowFullscreen = true;
    iframe.loading = 'lazy';
    wrapper.appendChild(iframe);

  } else if (source === 'facebook') {
    const iframe = document.createElement('iframe');
    const encoded = encodeURIComponent(url);
    iframe.src = `https://www.facebook.com/plugins/video.php?href=${encoded}&show_text=false&width=560`;
    iframe.allow = 'autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share';
    iframe.allowFullscreen = true;
    iframe.loading = 'lazy';
    wrapper.classList.add('facebook');
    wrapper.appendChild(iframe);

  } else if (source === 'tiktok') {
    wrapper.classList.add('tiktok');
    // Extract video ID from URL like tiktok.com/@user/video/12345
    const m = url.match(/video\/(\d+)/);
    const videoId = m ? m[1] : null;
    if (!videoId) return null;
    const blockquote = document.createElement('blockquote');
    blockquote.className = 'tiktok-embed';
    blockquote.cite = url;
    blockquote.setAttribute('data-video-id', videoId);
    blockquote.style.cssText = 'max-width:605px;min-width:325px;';
    wrapper.appendChild(blockquote);
    // Load TikTok script once
    if (!document.querySelector('script[src*="tiktok"]')) {
      const s = document.createElement('script');
      s.src = 'https://www.tiktok.com/embed.js';
      s.async = true;
      document.body.appendChild(s);
    } else if (window.tiktokEmbed) {
      window.tiktokEmbed.lib.render(wrapper.querySelectorAll('.tiktok-embed'));
    }

  } else if (source === 'instagram') {
    const iframe = document.createElement('iframe');
    iframe.src = instagramEmbedUrl(url);
    iframe.allow = 'autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share';
    iframe.allowFullscreen = true;
    iframe.loading = 'lazy';
    wrapper.classList.add('facebook'); // square-ish
    wrapper.appendChild(iframe);
  }

  return wrapper;
}

function createCard(item, index) {
  const source = detectSource(item.url);
  const card = document.createElement('div');
  card.className = 'card';
  card.style.animationDelay = `${(index % 10) * 60}ms`;

  const embedWrapper = buildEmbed(item.url, source);
  if (embedWrapper) card.appendChild(embedWrapper);

  const desc = document.createElement('div');
  desc.className = 'card-description';

  const tagLabels = { youtube: 'YouTube', facebook: 'Facebook', tiktok: 'TikTok', instagram: 'Instagram' };
  const tag = document.createElement('span');
  tag.className = `card-source-tag tag-${source}`;
  tag.textContent = tagLabels[source] || source;
  desc.appendChild(tag);

  const text = document.createElement('p');
  text.textContent = item.desc;
  desc.appendChild(text);

  card.appendChild(desc);
  return card;
}

/* ══ Lazy-load / Infinite scroll ══ */
const BATCH = 10;
let loaded = 0;
const grid = document.getElementById('grid');
const sentinel = document.getElementById('load-sentinel');
const loadingIndicator = document.getElementById('loading-indicator');

function loadBatch() {
  if (loaded >= PORTFOLIO.length) return;
  loadingIndicator.classList.add('visible');

  // Small timeout so UI doesn't freeze on heavy embed scripts
  setTimeout(() => {
    const end = Math.min(loaded + BATCH, PORTFOLIO.length);
    for (let i = loaded; i < end; i++) {
      grid.appendChild(createCard(PORTFOLIO[i], i));
    }
    loaded = end;
    loadingIndicator.classList.remove('visible');
  }, 50);
}
