<style>

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Heebo', sans-serif;
  background: #0a0a0f;
  color: #e8e8f0;
  min-height: 100vh;
}

/* ── HEADER ── */
header {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  background: rgba(10,10,15,0.96);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid #222233;
  padding: 18px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}

.site-title {
  font-size: clamp(1.4rem, 3.5vw, 2.8rem);
  font-weight: 900;
  background: linear-gradient(135deg, #c8a96e, #e8c98e);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1.2;
}

.header-buttons { display: flex; gap: 10px; flex-shrink: 0; }

.btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 9px 20px;
  border-radius: 50px;
  font-family: 'Heebo', sans-serif;
  font-size: 0.85rem;
  font-weight: 700;
  text-decoration: none;
  white-space: nowrap;
  border: none;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.4); }
.btn svg { width: 16px; height: 16px; flex-shrink: 0; }
.btn-wa    { background: #25D366; color: #fff; }
.btn-email { background: transparent; color: #c8a96e; border: 1.5px solid #c8a96e; }
.btn-email:hover { background: rgba(200,169,110,0.1); }

/* ── MAIN ── */
main { padding-top: 110px; padding-bottom: 60px; }

/* ── GRID ── */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(336px, 1fr));
  gap: 24px;
  max-width: 1440px;
  margin: 0 auto;
  padding: 24px 24px 0;
}

/* ── CARD ── */
.card {
  background: #13131a;
  border: 1px solid #222233;
  border-radius: 12px;
  overflow: hidden;
  transition: transform 0.2s, box-shadow 0.2s;
  animation: fadeUp 0.35s ease both;
}
.card:hover {
  transform: translateY(-4px);
  box-shadow: 0 14px 40px rgba(0,0,0,0.55), 0 0 0 1px rgba(200,169,110,0.2);
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(18px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── MEDIA BOX — always 16:9 ── */
.media-box {
  position: relative;
  width: 100%;
  padding-bottom: 56.25%;
  background: #000;
  overflow: hidden;
}

/* Full-fill: YouTube, images, Wikipedia */
.media-box iframe,
.media-box img {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  border: none;
}
.media-box img { object-fit: cover; }

/*
  Instagram & Facebook are 4:5 or 1:1 — fit by narrowing width.
  9:16 fitted inside 16:9 → width = (9/16)/(16/9) = 81/256 ≈ 31.64%
  But Instagram/FB embed ~4:5, so width = (4/5)/(16/9) = 36/80 = 45%
*/
.media-box iframe.ig,
.media-box iframe.fb {
  width: 45%;
  height: 100%;
  left: 50%;
  transform: translateX(-50%);
}

/*
  TikTok embed/v2 renders the video in a player that's roughly 3:4 overall
  (video area ~9:16, but player chrome makes the effective ratio ~3:4).
  3:4 fitted inside 16:9 → width = (3/4)/(16/9) = 27/64 ≈ 42%
*/
.media-box iframe.tt {
  width: 42%;
  height: 100%;
  left: 50%;
  transform: translateX(-50%);
}

/* ── CARD FOOTER ── */
.card-foot {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  border-top: 1px solid #222233;
}
.badge {
  width: 26px; height: 26px;
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.b-yt  { background: #f00; }
.b-fb  { background: #1877F2; }
.b-tt  { background: #111; border: 1px solid #444; }
.b-ig  { background: radial-gradient(circle at 30% 110%, #fdf497, #fd5949, #d6249f, #285AEB); }
.b-img { background: #444; }
.b-wp  { background: #2e6da4; }
.card-foot p { font-size: 0.84rem; color: #888899; line-height: 1.4; }

/* ── LOADING ── */
#sentinel { height: 1px; margin-top: 40px; }
#loading  { text-align: center; padding: 20px; color: #888899; font-size: 0.85rem; display: none; }
#loading.on { display: block; }

@media (max-width: 560px) {
  header { padding: 12px 14px; }
  .site-title { font-size: 1.1rem; }
  .btn { padding: 8px 13px; font-size: 0.78rem; }
  .grid { grid-template-columns: 1fr; padding: 16px 12px 0; }
}

function makeCard(item, delay) {
  var card = document.createElement('div');
  card.className = 'card';
  card.style.animationDelay = (delay * 60) + 'ms';

  var box = document.createElement('div');
  box.className = 'media-box';

  if (item.type === 'img') {
    var img = document.createElement('img');
    img.src = item.src;
    img.alt = item.desc;
    img.loading = 'lazy';
    box.appendChild(img);
  } else {
    var iframe = document.createElement('iframe');
    iframe.src = item.src;
    iframe.loading = 'lazy';
    // per-platform class for sizing
    iframe.className = item.type; // 'yt', 'tt', 'ig', 'fb', 'wp' — CSS targets tt/ig/fb
    if (item.type === 'yt' || item.type === 'wp') {
      iframe.allowFullscreen = true;
      iframe.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture');
    } else if (item.type === 'tt') {
      iframe.setAttribute('allow', 'autoplay; encrypted-media');
    } else if (item.type === 'ig' || item.type === 'fb') {
      iframe.scrolling = 'no';
      iframe.setAttribute('allowtransparency', 'true');
      if (item.type === 'fb') iframe.setAttribute('allow', 'encrypted-media');
    }
    box.appendChild(iframe);
  }

  var foot = document.createElement('div');
  foot.className = 'card-foot';
  foot.innerHTML =
    '<div class="badge ' + BADGE_CLASS[item.type] + '">' + I[item.type] + '</div>' +
    '<p>' + item.desc + '</p>';

  card.appendChild(box);
  card.appendChild(foot);
  return card;
}

function loadMore() {
  if (done >= ITEMS.length) { obs.disconnect(); return; }
  msg.classList.add('on');
  var batch = ITEMS.slice(done, done + PAGE);
  var frag = document.createDocumentFragment();
  for (var i = 0; i < batch.length; i++) {
    frag.appendChild(makeCard(batch[i], i));
  }
  grid.appendChild(frag);
  done += batch.length;
  msg.classList.remove('on');
}

loadMore(); // first 10

var obs = new IntersectionObserver(function(entries) {
  if (entries[0].isIntersecting) loadMore();
}, { rootMargin: '200px' });
obs.observe(sent);
