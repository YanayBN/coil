.card {

  border-radius: 12px;

.card:hover {

@keyframes fadeUp {

  to   { opacity: 1; transform: translateY(0); }

.video-box {
  position: relative;
  width: 100%;
  padding-bottom: 56.25%; /* 16:9 */
  background: #000;
  overflow: hidden;
}
.video-box iframe {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  border: none;
}

/* ── CARD FOOTER ── */
.card-foot {
